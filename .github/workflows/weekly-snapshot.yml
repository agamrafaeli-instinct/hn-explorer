name: Weekly snapshot
# Saves one file per complete UTC week to data/weekly/. Only a rolling window of the newest items is kept, so an unsaved week is lost.
# Runs Monday 05:17 UTC (12:17 Asia/Bangkok), after the daily data update at 02:23 UTC. A missed run is caught up next time
# for any complete week still inside the archive. A saved week is never overwritten.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: hn-daily-pages
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test snapshot script
        run: python -m unittest tests.test_weekly_snapshot tests.test_weekly_compare tests.test_verify_weekly tests.test_export_weekly -v
      - name: Check saved weeks against their hashes
        run: python scripts/verify_weekly.py
      - name: Save complete weeks that are not saved yet
        run: python scripts/weekly_snapshot.py
      - name: Compare weeks (writes data/compare, never data/weekly)
        run: python scripts/weekly_compare.py
      - name: Build Atlas aggregates over the whole archive
        run: |
          pip install duckdb
          python scripts/atlas_aggregates.py
          python scripts/concentration_archive.py
      - name: Refresh copy that embeds atlas numbers
        run: |
          python scripts/refresh_data_copy.py
          python scripts/phoenix_charts.py
      - name: Build Lens history files
        run: python scripts/lens_build.py
      - name: Draft, check and publish weekly findings
        run: |
          python scripts/findings_draft.py
          python scripts/findings_publish.py
      - name: Export weeks to CSV
        run: python scripts/export_weekly.py
      - name: Record hashes of new weeks, fail if an older week changed
        run: python scripts/verify_weekly.py --add-new
      - name: Refuse to change any saved week
        run: |
          changed=$(git diff --name-only -- data/weekly | grep -v -e '^data/weekly/index.json$' -e '^data/weekly/hashes.json$' || true)
          if [ -n "$changed" ]; then echo "Saved week changed: $changed"; exit 1; fi
      - name: Commit new weeks
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weekly data/compare data/exports data/findings data/lens data/atlas index.html router.js scripts/build_share_pages.py
          if git diff --cached --quiet; then echo "pushed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m 'Save weekly snapshot'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 10
          done
          echo "pushed=yes" >> "$GITHUB_OUTPUT"
      - name: Publish the site (Pages source is GitHub Actions)
        if: steps.commit.outputs.pushed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily-hn.yml --repo "$GITHUB_REPOSITORY"
